name: Neon Database Operations (Manual Only)

# This workflow is completely disabled for automatic triggers
# It only runs when manually triggered via GitHub Actions UI or API
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose Neon operation to perform'
        required: true
        default: 'create-branch'
        type: choice
        options:
          - create-branch
          - delete-branch
          - run-migrations
          - schema-diff
      branch_name:
        description: 'Branch name (for create/delete operations)'
        required: false
        type: string
      pr_number:
        description: 'PR number (for create/delete operations)'
        required: false
        type: string

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    steps:
      - name: Get branch name
        id: branch_name
        run: echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: github.event.inputs.operation == 'create-branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ github.event.inputs.branch_name || format('manual-{0}', github.run_number) }}
          api_key: ${{ secrets.NEON_API_KEY }}
          username: neondb_owner

      - name: Run Database Migrations
        run: pnpm run db:push
        env:
          DATABASE_URL_UNPOOLED: '${{ steps.create_neon_branch.outputs.db_url_with_pooler }}'

      - name: Post Schema Diff Comment to PR
        if: github.event.inputs.pr_number
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: ${{ github.event.inputs.branch_name || format('manual-{0}', github.run_number) }}
          api_key: ${{ secrets.NEON_API_KEY }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event.inputs.operation == 'delete-branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ github.event.inputs.branch_name }}
          api_key: ${{ secrets.NEON_API_KEY }}

  run_migrations:
    name: Run Migrations
    needs: setup
    if: github.event.inputs.operation == 'run-migrations'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        run: pnpm run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  schema_diff:
    name: Schema Diff
    needs: setup
    if: github.event.inputs.operation == 'schema-diff'
    runs-on: ubuntu-latest
    steps:
      - name: Post Schema Diff Comment to PR
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: ${{ github.event.inputs.branch_name }}
          api_key: ${{ secrets.NEON_API_KEY }}

  no_operation:
    name: No Operation Selected
    if: github.event.inputs.operation == ''
    runs-on: ubuntu-latest
    steps:
      - name: No operation
        run: echo "No operation selected. This workflow is for manual Neon operations only."
