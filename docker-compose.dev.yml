# Local Postgres for development and integration tests.
# The app connects with node-postgres (src/db/pg-pool.ts), so this is the same
# kind of server as production (Neon or self-hosted, e.g. Hetzner).
#
#   docker compose -f docker-compose.dev.yml up -d
#   cat .env.test.local.example >> .env.local
#   pnpm db:push
services:
  postgres:
    image: postgres:17
    container_name: futura-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: futura
    ports:
      - '127.0.0.1:5452:5432'
    volumes:
      - futura_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d futura']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  futura_db_data:
