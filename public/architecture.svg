<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Futura architecture</title>
  <desc>How Futura is built: people use a Next.js web app on Vercel. It keeps accounts and memory details in a Postgres database and photo files in Vercel Blob or Amazon S3 (the Web2 side). People can choose to keep memories on the Internet Computer instead in a backend canister that the user writes to directly with their own Internet Identity key (the Web3 side).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">How Futura is built</text>
  <text x="40" y="74" font-size="15" fill="#475569">Memories are kept on the Web2 side by default. People who want "forever" storage can choose the Internet Computer instead.</text>

  <!-- People -->
  <rect x="40" y="250" width="210" height="190" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="145" cy="300" r="22" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <path d="M105,352 q40,-38 80,0" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="145" y="385" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">You</text>
  <text x="145" y="406" font-size="13" fill="#475569" text-anchor="middle">couple, family,</text>
  <text x="145" y="423" font-size="13" fill="#475569" text-anchor="middle">photographer, in a browser</text>

  <!-- Web app -->
  <rect x="320" y="170" width="330" height="350" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="340" y="202" font-size="18" font-weight="700" fill="#1e3a8a">Futura web app</text>
  <text x="340" y="222" font-size="13" fill="#1e40af">Next.js, hosted on Vercel</text>
  <rect x="340" y="238" width="290" height="72" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="356" y="263" font-size="14" font-weight="600" fill="#0f172a">Pages</text>
  <text x="356" y="283" font-size="13" fill="#334155">dashboard, galleries, sharing,</text>
  <text x="356" y="300" font-size="13" fill="#334155">in English, German, Turkish</text>
  <rect x="340" y="320" width="290" height="72" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="356" y="345" font-size="14" font-weight="600" fill="#0f172a">Login</text>
  <text x="356" y="365" font-size="13" fill="#334155">Google, GitHub, e-mail and password,</text>
  <text x="356" y="382" font-size="13" fill="#334155">or Internet Identity (passkey)</text>
  <rect x="340" y="402" width="290" height="98" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="356" y="427" font-size="14" font-weight="600" fill="#0f172a">Server functions (API)</text>
  <text x="356" y="447" font-size="13" fill="#334155">uploads, sharing links, e-mails,</text>
  <text x="356" y="464" font-size="13" fill="#334155">checks Internet Identity sign-ins,</text>
  <text x="356" y="481" font-size="13" fill="#334155">photographer to client delivery</text>

  <!-- Web2 side -->
  <rect x="720" y="110" width="440" height="300" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="740" y="142" font-size="18" font-weight="700" fill="#14532d">Web2 side</text>
  <text x="740" y="162" font-size="13" fill="#166534">fast, cheap, run by companies</text>
  <rect x="740" y="178" width="400" height="108" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="756" y="203" font-size="14" font-weight="600" fill="#0f172a">Database (Postgres)</text>
  <text x="756" y="223" font-size="13" fill="#334155">accounts, memory details, galleries, shares,</text>
  <text x="756" y="240" font-size="13" fill="#334155">and a record of where each copy of a memory lives</text>
  <text x="756" y="262" font-size="13" fill="#64748b">Neon today, own server (Hetzner) possible:</text>
  <text x="756" y="278" font-size="13" fill="#64748b">the app speaks plain Postgres</text>
  <rect x="740" y="296" width="400" height="94" rx="10" fill="#ffffff" stroke="#86efac"/>
  <text x="756" y="321" font-size="14" font-weight="600" fill="#0f172a">Photo and video files</text>
  <text x="756" y="341" font-size="13" fill="#334155">Vercel Blob or Amazon S3, plus the smaller</text>
  <text x="756" y="358" font-size="13" fill="#334155">display and thumbnail versions made on upload</text>

  <!-- Web3 side -->
  <rect x="720" y="450" width="440" height="300" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="740" y="482" font-size="18" font-weight="700" fill="#4c1d95">Web3 side: Internet Computer (ICP)</text>
  <text x="740" y="502" font-size="13" fill="#5b21b6">chosen in the settings; runs on a public network</text>
  <rect x="740" y="518" width="400" height="94" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="756" y="543" font-size="14" font-weight="600" fill="#0f172a">Backend canister (Futura's program on ICP)</text>
  <text x="756" y="563" font-size="13" fill="#334155">one capsule per person: memories, galleries, files;</text>
  <text x="756" y="580" font-size="13" fill="#334155">hands out files only with short-lived signed links</text>
  <text x="756" y="600" font-size="13" fill="#64748b">live on mainnet: izhgj-eiaaa-aaaaj-a2f7q-cai</text>
  <rect x="740" y="622" width="192" height="108" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="754" y="646" font-size="14" font-weight="600" fill="#0f172a">Internet Identity</text>
  <text x="754" y="666" font-size="13" fill="#334155">DFINITY's login:</text>
  <text x="754" y="683" font-size="13" fill="#334155">a passkey gives each</text>
  <text x="754" y="700" font-size="13" fill="#334155">person their own key</text>
  <rect x="948" y="622" width="192" height="108" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-dasharray="5 4"/>
  <text x="962" y="646" font-size="14" font-weight="600" fill="#0f172a">Canister factory</text>
  <text x="962" y="666" font-size="13" fill="#334155">planned: a personal</text>
  <text x="962" y="683" font-size="13" fill="#334155">canister for each</text>
  <text x="962" y="700" font-size="13" fill="#334155">person who wants one</text>

  <!-- Helpers -->
  <rect x="320" y="580" width="330" height="170" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="610" font-size="16" font-weight="700" fill="#7c2d12">Outside services</text>
  <text x="340" y="636" font-size="13" fill="#334155">Mailgun: e-mails (sharing, notifications)</text>
  <text x="340" y="658" font-size="13" fill="#334155">PostHog: visitor analytics</text>
  <text x="340" y="680" font-size="13" fill="#334155">OpenAI / Google Gemini: AI chat</text>
  <text x="340" y="702" font-size="13" fill="#334155">Google, GitHub: login</text>
  <text x="340" y="728" font-size="12" fill="#9a3412">used by the web app, never by the canister</text>

  <!-- Arrows -->
  <!-- You -> web app -->
  <line x1="250" y1="330" x2="316" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="318" font-size="12" fill="#475569">uses</text>
  <!-- web app -> database -->
  <line x1="650" y1="232" x2="736" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="656" y="222" font-size="12" fill="#475569">read/write</text>
  <!-- web app -> files -->
  <line x1="650" y1="343" x2="736" y2="343" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="664" y="333" font-size="12" fill="#475569">uploads</text>
  <!-- web app -> canister (check sign-in) -->
  <path d="M650,492 C692,492 694,550 736,550" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="656" y="466" font-size="12" fill="#475569">checks</text>
  <text x="656" y="481" font-size="12" fill="#475569">sign-ins</text>
  <!-- web app -> helpers -->
  <line x1="485" y1="520" x2="485" y2="576" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- You -> ICP directly with own key -->
  <path d="M145,440 V780 Q145,790 155,790 H690 Q700,790 700,780 V590 Q700,580 710,580 H736" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#arrow-key)"/>
  <text x="170" y="822" font-size="14" font-weight="600" fill="#5b21b6">Your browser talks to ICP directly, with your own key.</text>
  <text x="170" y="842" font-size="13" fill="#5b21b6">Futura's server cannot write into your capsule for you: the key stays with you.</text>

  <!-- Footer -->
  <text x="40" y="884" font-size="12" fill="#94a3b8">Futura · state of November 2026 · code: github.com/552020/futura_alpha_nextjs and futura_alpha_icp</text>
</svg>
