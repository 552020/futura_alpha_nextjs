<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<title>Futura running: who talks to whom</title>
<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { padding:16px; font-family:"Patrick Hand","Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }
  svg { display:block; width:100%; height:auto; max-width:1500px; margin:0 auto; }
  .line  { fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .thin  { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .plan  { stroke-dasharray:9 7; }
  .svc   { stroke:var(--accent); stroke-width:2.2; }
  .acc   { stroke:var(--accent); }
  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }
  .door  { fill:var(--accent); stroke:var(--ink); stroke-width:1.6; }
  .ca { fill:var(--accent); stroke:var(--ink); stroke-width:1; }
  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }
  .cc { fill:#c9c6bd; stroke:var(--ink); stroke-width:1; }
  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }
  .pa { fill:#ffffff; stroke:var(--ink); stroke-width:2.2; }
  .pk { fill:#dedbd2; stroke:var(--ink); stroke-width:1.4; }
  .ps { fill:url(#hatch); stroke:var(--ink); stroke-width:1.4; }
  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
  .monoa { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:16px; fill:var(--accent); }
</style>
</head>
<body>
<svg viewBox="0 0 1500 960" role="img" aria-label="Futura when it runs: people use the web app on Vercel; it keeps data in Postgres on Neon; the browser uploads files straight to Amazon S3, or with the person&#x27;s own key to the backend canister on the Internet Computer, and signs in with Internet Identity">
  <defs>
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
  </defs>
  <g filter="url(#hand)">
    <rect x="30" y="300" width="230" height="196" rx="8" class="line fill"/>
    <rect x="320" y="150" width="520" height="470" rx="10" class="line fill plan"/>
    <rect x="340" y="200" width="480" height="404" rx="6" class="line fill"/>
    <rect x="356" y="272" width="448" height="86" rx="6" class="thin fill"/>
    <rect x="356" y="370" width="448" height="86" rx="6" class="thin fill"/>
    <rect x="356" y="468" width="448" height="128" rx="6" class="thin fill"/>
    <rect x="340" y="660" width="480" height="96" rx="6" class="line fill"/>
    <path d="M580,606 L580,656" class="line" marker-end="url(#arrow)"/>
    <rect x="900" y="80" width="570" height="390" rx="10" class="line fill"/>
    <rect x="920" y="132" width="530" height="156" rx="6" class="line fill"/>
    <rect x="920" y="304" width="530" height="146" rx="6" class="line fill"/>
    <rect x="900" y="500" width="570" height="336" rx="10" class="line fill"/>
    <rect x="920" y="552" width="530" height="146" rx="6" class="line fill"/>
    <rect x="920" y="714" width="530" height="104" rx="6" class="line fill"/>
    <path d="M262,360 L336,360" class="line" marker-end="url(#arrow)"/>
    <path d="M822,214 L916,214" class="line" marker-end="url(#arrow)"/>
    <path d="M145,298 L145,124 L886,124 L886,376 L916,376" class="line" marker-end="url(#arrow)"/>
    <path d="M110,498 L110,850 L878,850 L878,630 L916,630" class="line acc" marker-end="url(#arrow)"/>
    <path d="M200,498 L200,826 L862,826 L862,766 L916,766" class="line" marker-end="url(#arrow)"/>
    <path d="M806,540 L856,540 L856,600 L916,600" class="line" marker-end="url(#arrow)"/>
  </g>
  <circle cx="580" cy="612" r="6" class="dot"/>
  <circle cx="268" cy="360" r="6" class="dot"/>
  <circle cx="828" cy="214" r="6" class="dot"/>
  <circle cx="145" cy="292" r="6" class="dot"/>
  <circle cx="110" cy="504" r="6" class="dot"/>
  <circle cx="200" cy="504" r="6" class="dot"/>
  <circle cx="812" cy="540" r="6" class="dot"/>
  <circle cx="46" cy="40" r="6" class="dot"/>
  <text x="750" y="46" class="h" text-anchor="middle">Futura running: who talks to whom</text>
  <text x="46" y="332" class="t">You, in a browser</text>
  <text x="46" y="360" class="s">couple, family,</text>
  <text x="46" y="384" class="s">photographer</text>
  <text x="46" y="418" class="xs">phone or laptop</text>
  <text x="46" y="440" class="a">holds your ICP key</text>
  <text x="46" y="462" class="a">for the session</text>
  <text x="340" y="182" class="t">Vercel</text>
  <text x="820" y="182" class="a" text-anchor="end">deployment disabled now</text>
  <text x="356" y="230" class="t">Futura web app</text>
  <text x="356" y="254" class="s">Next.js: pages and server functions</text>
  <text x="372" y="300" class="t">Pages</text>
  <text x="372" y="326" class="s">dashboard, galleries, sharing, settings</text>
  <text x="372" y="348" class="xs">English, German, Turkish</text>
  <text x="372" y="398" class="t">Login (Auth.js)</text>
  <text x="372" y="424" class="s">Google, GitHub, e-mail, Internet Identity</text>
  <text x="372" y="446" class="xs">one account can link several</text>
  <text x="372" y="494" class="t">Server routes</text>
  <text x="372" y="518" class="mono">/api/upload/s3/presign</text>
  <text x="372" y="538" class="mono">/api/upload/complete</text>
  <text x="372" y="558" class="mono">/api/ii/challenge</text>
  <text x="372" y="578" class="mono">/api/auth/callback/ii</text>
  <text x="358" y="688" class="t">Outside services</text>
  <text x="358" y="714" class="xs">Mailgun: e-mails. PostHog: visitor counts. OpenAI and Gemini:</text>
  <text x="358" y="734" class="xs">the AI chat. Google and GitHub: login.</text>
  <text x="920" y="112" class="t">Web2 side</text>
  <text x="1450" y="112" class="s" text-anchor="end">run by companies, cheap</text>
  <text x="936" y="162" class="t">Postgres on Neon</text>
  <text x="1434" y="162" class="a" text-anchor="end">Hetzner possible</text>
  <text x="936" y="190" class="s">accounts, memories, galleries, shares</text>
  <text x="936" y="216" class="s">storage edges: where each copy of a memory lives</text>
  <text x="936" y="242" class="s">Internet Identity nonces: one-time codes</text>
  <text x="936" y="268" class="xs">the app speaks plain Postgres, any server works</text>
  <text x="936" y="334" class="t">Amazon S3</text>
  <text x="1434" y="334" class="a" text-anchor="end">Vercel Blob: the other option</text>
  <text x="936" y="362" class="s">the files: original, display, thumbnail</text>
  <text x="936" y="388" class="xs">the server only signs short-lived upload links;</text>
  <text x="936" y="408" class="xs">the files themselves never pass through it</text>
  <text x="920" y="532" class="t">Internet Computer, mainnet</text>
  <text x="1450" y="532" class="s" text-anchor="end">a public network</text>
  <text x="936" y="582" class="t">Backend canister</text>
  <text x="1434" y="582" class="a" text-anchor="end">Futura&#x27;s program</text>
  <text x="936" y="608" class="mono">izhgj-eiaaa-aaaaj-a2f7q-cai</text>
  <text x="936" y="636" class="s">one capsule per person: memories, galleries, files</text>
  <text x="936" y="662" class="xs">written only with the person&#x27;s own key;</text>
  <text x="936" y="682" class="xs">files go out only through short-lived signed links</text>
  <text x="936" y="744" class="t">Internet Identity</text>
  <text x="1434" y="744" class="a" text-anchor="end">DFINITY&#x27;s login</text>
  <text x="936" y="770" class="mono">identity.ic0.app</text>
  <text x="936" y="796" class="xs">a passkey gives each person a key for this site</text>
  <text x="288" y="348" class="xs" text-anchor="middle">https</text>
  <text x="858" y="204" class="mono" text-anchor="middle">SQL</text>
  <text x="510" y="114" class="a" text-anchor="middle">uploads the files itself, with a link the server signed</text>
  <text x="500" y="842" class="a" text-anchor="middle">with your own key: capsule, uploads, reads</text>
  <text x="500" y="818" class="s" text-anchor="middle">passkey sign-in, in a popup</text>
  <text x="60" y="898" class="s">The browser opens most connections: to the web app, to S3 with a link the server signed, and to the canister with the person&#x27;s own key.</text>
  <text x="60" y="926" class="s">The server works with Postgres and, on ICP, only checks who signed a sign-in code: it cannot write into anyone&#x27;s capsule.</text>
  <text x="60" y="954" class="a">Status: the code passes all tests; the Vercel deployment is disabled and mainnet runs the canister without the November 2026 fixes.</text>
  <text x="1480" y="954" class="s" text-anchor="end">As of: 24 November 2026</text>
  <text x="62" y="47" class="s">who opens the connection</text>
</svg>
</body>
</html>
