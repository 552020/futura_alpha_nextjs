<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<title>Creating a personal canister, step by step</title>
<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { padding:16px; font-family:"Patrick Hand","Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }
  svg { display:block; width:100%; height:auto; max-width:1500px; margin:0 auto; }
  .line  { fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .thin  { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .plan  { stroke-dasharray:9 7; }
  .svc   { stroke:var(--accent); stroke-width:2.2; }
  .acc   { stroke:var(--accent); }
  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }
  .door  { fill:var(--accent); stroke:var(--ink); stroke-width:1.6; }
  .ca { fill:var(--accent); stroke:var(--ink); stroke-width:1; }
  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }
  .cc { fill:#c9c6bd; stroke:var(--ink); stroke-width:1; }
  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }
  .pa { fill:#ffffff; stroke:var(--ink); stroke-width:2.2; }
  .pk { fill:#dedbd2; stroke:var(--ink); stroke-width:1.4; }
  .ps { fill:url(#hatch); stroke:var(--ink); stroke-width:1.4; }
  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
  .monoa { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:16px; fill:var(--accent); }
</style>
</head>
<body>
<svg viewBox="0 0 1500 960" role="img" aria-label="Creating a personal canister: the admin releases the backend program in the factory; a signed-in person asks for a canister; the factory creates it with itself and the person as controllers, installs the program with the person as owner, then leaves the person as the only controller">
  <defs>
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
  </defs>
  <g filter="url(#hand)">
    <rect x="20" y="70" width="1460" height="790" rx="10" class="line fill"/>
    <rect x="30" y="200" width="240" height="212" rx="6" class="line fill"/>
    <rect x="330" y="190" width="700" height="650" rx="6" class="line fill"/>
    <rect x="346" y="200" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="200" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,238 L1056,238" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="290" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="290" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,328 L1056,328" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="380" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="380" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,418 L1056,418" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="470" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="470" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,508 L1056,508" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="560" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="560" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,598 L1056,598" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="650" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="650" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,688 L1056,688" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="740" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="740" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,778 L1056,778" class="line" marker-end="url(#arrow)"/>
    <path d="M274,230 L328,230" class="line" marker-end="url(#arrow)"/>
  </g>
  <circle cx="280" cy="230" r="6" class="dot"/>
  <circle cx="46" cy="40" r="6" class="dot"/>
  <text x="750" y="46" class="h" text-anchor="middle">Creating a personal canister, step by step</text>
  <text x="150" y="122" class="col" text-anchor="middle">YOU</text>
  <text x="150" y="150" class="s" text-anchor="middle">the future owner</text>
  <text x="680" y="122" class="col" text-anchor="middle">THE STEPS</text>
  <text x="680" y="150" class="s" text-anchor="middle">what happens, in order</text>
  <text x="1260" y="122" class="col" text-anchor="middle">WHAT EXISTS NOW</text>
  <text x="1260" y="150" class="s" text-anchor="middle">after each step</text>
  <text x="46" y="232" class="t">Your key</text>
  <text x="46" y="262" class="s">from Internet Identity</text>
  <text x="46" y="286" class="s">on the web app&#x27;s ICP page,</text>
  <text x="46" y="310" class="s">or in a terminal (dfx)</text>
  <text x="46" y="344" class="xs">you:</text>
  <text x="46" y="366" class="a">ask the factory for a</text>
  <text x="46" y="386" class="a">canister</text>
  <text x="362" y="230" class="t">0</text>
  <text x="396" y="228" class="t">release the program</text>
  <text x="396" y="248" class="s">the gzipped backend program, uploaded in chunks; then release_set with a</text>
  <text x="396" y="267" class="s">version name</text>
  <text x="1002" y="228" class="a" text-anchor="end">Futura&#x27;s admin</text>
  <text x="1074" y="228" class="s">a release in the factory: version,</text>
  <text x="1074" y="249" class="xs">sha256, the program</text>
  <text x="362" y="320" class="t">1</text>
  <text x="396" y="318" class="t">give a credit</text>
  <text x="396" y="338" class="s">personal_credit_set for your principal. One credit pays for one canister;</text>
  <text x="396" y="357" class="s">admins need none</text>
  <text x="1002" y="318" class="a" text-anchor="end">Futura&#x27;s admin</text>
  <text x="1074" y="318" class="s">a credit for you in the factory</text>
  <text x="362" y="410" class="t">2</text>
  <text x="396" y="408" class="t">ask for a canister</text>
  <text x="396" y="428" class="s">create_personal_canister. Without a credit it is refused and nothing is</text>
  <text x="396" y="447" class="s">stored. Anonymous callers are refused</text>
  <text x="1002" y="408" class="a" text-anchor="end">you</text>
  <text x="1074" y="408" class="s">a registry entry for you: Pending</text>
  <text x="362" y="500" class="t">3</text>
  <text x="396" y="498" class="t">create the canister</text>
  <text x="396" y="518" class="s">the factory asks the network for a new canister, with 2T cycles and a</text>
  <text x="396" y="537" class="s">freezing threshold of 90 days</text>
  <text x="1002" y="498" class="a" text-anchor="end">factory</text>
  <text x="1074" y="498" class="s">an empty canister; controllers: the</text>
  <text x="1074" y="516" class="xs">factory and you; the credit is used up;</text>
  <text x="1074" y="534" class="xs">registry: Created</text>
  <text x="362" y="590" class="t">4</text>
  <text x="396" y="588" class="t">install the program</text>
  <text x="396" y="608" class="s">the released program, installed with init(owner = you): that makes it</text>
  <text x="396" y="627" class="s">personal</text>
  <text x="1002" y="588" class="a" text-anchor="end">factory</text>
  <text x="1074" y="588" class="s">your canister runs the backend with you</text>
  <text x="1074" y="609" class="xs">as owner; registry: Installed</text>
  <text x="362" y="680" class="t">5</text>
  <text x="396" y="678" class="t">hand over</text>
  <text x="396" y="702" class="s">the factory sets the controllers to you alone, and so removes itself</text>
  <text x="1002" y="678" class="a" text-anchor="end">factory</text>
  <text x="1074" y="678" class="s">you are the only controller; registry:</text>
  <text x="1074" y="699" class="xs">Ready</text>
  <text x="362" y="770" class="t">6</text>
  <text x="396" y="768" class="t">use it</text>
  <text x="396" y="788" class="s">create your capsule and store memories with your own key. Today from a</text>
  <text x="396" y="807" class="s">terminal only</text>
  <text x="1002" y="768" class="a" text-anchor="end">you</text>
  <text x="1074" y="768" class="s">your capsule in your own canister;</text>
  <text x="1074" y="789" class="xs">nobody else can write there</text>
  <text x="60" y="898" class="s">If a step fails, or a call hangs for more than 10 minutes, call create_personal_canister again: the registry remembers the canister and how far it got,</text>
  <text x="60" y="926" class="s">so no second canister is created and no second credit is needed. Once it is Ready, the call just returns the same canister.</text>
  <text x="60" y="954" class="a">Status: tested on a local ICP network, 25 November 2026: all steps in a terminal, steps 2 to 5 also from the web app. Not built: top-ups, payment, credits without the admin.</text>
  <text x="1480" y="954" class="s" text-anchor="end">As of: 25 November 2026</text>
  <text x="62" y="47" class="s">who starts the step</text>
</svg>
</body>
</html>
