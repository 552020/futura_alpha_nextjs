<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<title>Creating a personal canister, step by step</title>
<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { padding:16px; font-family:"Patrick Hand","Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }
  svg { display:block; width:100%; height:auto; max-width:1500px; margin:0 auto; }
  .line  { fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .thin  { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .plan  { stroke-dasharray:9 7; }
  .svc   { stroke:var(--accent); stroke-width:2.2; }
  .acc   { stroke:var(--accent); }
  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }
  .door  { fill:var(--accent); stroke:var(--ink); stroke-width:1.6; }
  .ca { fill:var(--accent); stroke:var(--ink); stroke-width:1; }
  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }
  .cc { fill:#c9c6bd; stroke:var(--ink); stroke-width:1; }
  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }
  .pa { fill:#ffffff; stroke:var(--ink); stroke-width:2.2; }
  .pk { fill:#dedbd2; stroke:var(--ink); stroke-width:1.4; }
  .ps { fill:url(#hatch); stroke:var(--ink); stroke-width:1.4; }
  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
  .monoa { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:16px; fill:var(--accent); }
</style>
</head>
<body>
<svg viewBox="0 0 1500 960" role="img" aria-label="Creating a personal canister: the admin releases the backend program in the factory; a signed-in person asks for a canister; the factory creates it with itself and the person as controllers, installs the program with the person as owner, then leaves the person as the only controller">
  <defs>
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
  </defs>
  <g filter="url(#hand)">
    <rect x="20" y="70" width="1460" height="790" rx="10" class="line fill"/>
    <rect x="30" y="200" width="240" height="212" rx="6" class="line fill"/>
    <rect x="330" y="190" width="700" height="650" rx="6" class="line fill"/>
    <rect x="346" y="200" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="200" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,245 L1056,245" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="305" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="305" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,350 L1056,350" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="410" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="410" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,455 L1056,455" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="515" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="515" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,560 L1056,560" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="620" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="620" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,665 L1056,665" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="725" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="725" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,770 L1056,770" class="line" marker-end="url(#arrow)"/>
    <path d="M274,230 L328,230" class="line" marker-end="url(#arrow)"/>
  </g>
  <circle cx="280" cy="230" r="6" class="dot"/>
  <circle cx="46" cy="40" r="6" class="dot"/>
  <text x="750" y="46" class="h" text-anchor="middle">Creating a personal canister, step by step</text>
  <text x="150" y="122" class="col" text-anchor="middle">YOU</text>
  <text x="150" y="150" class="s" text-anchor="middle">the future owner</text>
  <text x="680" y="122" class="col" text-anchor="middle">THE STEPS</text>
  <text x="680" y="150" class="s" text-anchor="middle">what happens, in order</text>
  <text x="1260" y="122" class="col" text-anchor="middle">WHAT EXISTS NOW</text>
  <text x="1260" y="150" class="s" text-anchor="middle">after each step</text>
  <text x="46" y="232" class="t">Your key</text>
  <text x="46" y="262" class="s">a signed-in principal</text>
  <text x="46" y="286" class="s">today: from a terminal</text>
  <text x="46" y="310" class="s">(dfx), no web page yet</text>
  <text x="46" y="344" class="xs">you:</text>
  <text x="46" y="366" class="a">ask the factory for a</text>
  <text x="46" y="386" class="a">canister</text>
  <text x="362" y="230" class="t">0</text>
  <text x="396" y="228" class="t">release the program</text>
  <text x="396" y="252" class="s">the gzipped backend program, uploaded in chunks; then release_set with a</text>
  <text x="396" y="273" class="s">version name</text>
  <text x="1002" y="228" class="a" text-anchor="end">Futura&#x27;s admin</text>
  <text x="1074" y="228" class="s">a release in the factory: version,</text>
  <text x="1074" y="249" class="xs">sha256, the program</text>
  <text x="362" y="335" class="t">1</text>
  <text x="396" y="333" class="t">ask for a canister</text>
  <text x="396" y="357" class="s">create_personal_canister. Anonymous callers are refused; one creation at a</text>
  <text x="396" y="378" class="s">time per person</text>
  <text x="1002" y="333" class="a" text-anchor="end">you</text>
  <text x="1074" y="333" class="s">a registry entry for you: Pending</text>
  <text x="362" y="440" class="t">2</text>
  <text x="396" y="438" class="t">create the canister</text>
  <text x="396" y="462" class="s">the factory asks the network for a new canister and gives it 2T cycles</text>
  <text x="1002" y="438" class="a" text-anchor="end">factory</text>
  <text x="1074" y="438" class="s">an empty canister; controllers: the</text>
  <text x="1074" y="459" class="xs">factory and you; registry: Created</text>
  <text x="362" y="545" class="t">3</text>
  <text x="396" y="543" class="t">install the program</text>
  <text x="396" y="567" class="s">the released program, installed with init(owner = you): that makes it</text>
  <text x="396" y="588" class="s">personal</text>
  <text x="1002" y="543" class="a" text-anchor="end">factory</text>
  <text x="1074" y="543" class="s">your canister runs the backend with you</text>
  <text x="1074" y="564" class="xs">as owner; registry: Installed</text>
  <text x="362" y="650" class="t">4</text>
  <text x="396" y="648" class="t">hand over</text>
  <text x="396" y="672" class="s">the factory sets the controllers to you alone, and so removes itself</text>
  <text x="1002" y="648" class="a" text-anchor="end">factory</text>
  <text x="1074" y="648" class="s">you are the only controller; registry:</text>
  <text x="1074" y="669" class="xs">Ready</text>
  <text x="362" y="755" class="t">5</text>
  <text x="396" y="753" class="t">use it</text>
  <text x="396" y="777" class="s">create your capsule and store memories with your own key</text>
  <text x="1002" y="753" class="a" text-anchor="end">you</text>
  <text x="1074" y="753" class="s">your capsule in your own canister;</text>
  <text x="1074" y="774" class="xs">nobody else can create one there</text>
  <text x="60" y="898" class="s">If a step fails, call create_personal_canister again: the registry remembers the canister and how far it got, so no second canister is created</text>
  <text x="60" y="926" class="s">and no cycles are spent twice. Once it is Ready, the call just returns the same canister.</text>
  <text x="60" y="954" class="a">Status: tested on a local ICP network, 25 November 2026. Not built: a web page for it, a limit on who may ask, cycles top-ups, payment.</text>
  <text x="1480" y="954" class="s" text-anchor="end">As of: 25 November 2026</text>
  <text x="62" y="47" class="s">who starts the step</text>
</svg>
</body>
</html>
