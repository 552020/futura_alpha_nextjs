<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<title>Uploading a memory to the Web2 side, step by step</title>
<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { padding:16px; font-family:"Patrick Hand","Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }
  svg { display:block; width:100%; height:auto; max-width:1500px; margin:0 auto; }
  .line  { fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .thin  { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .plan  { stroke-dasharray:9 7; }
  .svc   { stroke:var(--accent); stroke-width:2.2; }
  .acc   { stroke:var(--accent); }
  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }
  .door  { fill:var(--accent); stroke:var(--ink); stroke-width:1.6; }
  .ca { fill:var(--accent); stroke:var(--ink); stroke-width:1; }
  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }
  .cc { fill:#c9c6bd; stroke:var(--ink); stroke-width:1; }
  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }
  .pa { fill:#ffffff; stroke:var(--ink); stroke-width:2.2; }
  .pk { fill:#dedbd2; stroke:var(--ink); stroke-width:1.4; }
  .ps { fill:url(#hatch); stroke:var(--ink); stroke-width:1.4; }
  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
  .monoa { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:16px; fill:var(--accent); }
</style>
</head>
<body>
<svg viewBox="0 0 1500 960" role="img" aria-label="Uploading on the Web2 side: the web app signs short-lived S3 links; the browser uploads the original and the smaller versions straight to S3; the web app then records the memory and where its files are in Postgres">
  <defs>
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
  </defs>
  <g filter="url(#hand)">
    <rect x="20" y="70" width="1460" height="790" rx="10" class="line fill"/>
    <rect x="30" y="200" width="240" height="168" rx="6" class="line fill"/>
    <rect x="330" y="190" width="700" height="545" rx="6" class="line fill"/>
    <rect x="346" y="200" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="200" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,245 L1056,245" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="305" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="305" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,350 L1056,350" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="410" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="410" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,455 L1056,455" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="515" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="515" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,560 L1056,560" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="620" width="668" height="91" rx="6" class="thin fill"/>
    <rect x="1060" y="620" width="400" height="91" rx="6" class="thin fill"/>
    <path d="M1016,665 L1056,665" class="line" marker-end="url(#arrow)"/>
    <path d="M274,230 L328,230" class="line" marker-end="url(#arrow)"/>
  </g>
  <circle cx="280" cy="230" r="6" class="dot"/>
  <circle cx="46" cy="40" r="6" class="dot"/>
  <text x="750" y="46" class="h" text-anchor="middle">Uploading a memory to the Web2 side, step by step</text>
  <text x="150" y="122" class="col" text-anchor="middle">THE BROWSER</text>
  <text x="150" y="150" class="s" text-anchor="middle">where you click</text>
  <text x="680" y="122" class="col" text-anchor="middle">THE STEPS</text>
  <text x="680" y="150" class="s" text-anchor="middle">what happens, in order</text>
  <text x="1260" y="122" class="col" text-anchor="middle">WHAT EXISTS NOW</text>
  <text x="1260" y="150" class="s" text-anchor="middle">after each step</text>
  <text x="46" y="232" class="t">Dashboard</text>
  <text x="46" y="262" class="s">your setting: Web2</text>
  <text x="46" y="286" class="s">files go to S3 (default)</text>
  <text x="46" y="320" class="xs">you:</text>
  <text x="46" y="342" class="a">pick files or a folder</text>
  <text x="362" y="230" class="t">0</text>
  <text x="396" y="228" class="t">ask for upload links</text>
  <text x="396" y="252" class="s">the web app signs one short-lived S3 link per file version</text>
  <text x="1002" y="228" class="a" text-anchor="end">/api/upload/s3/presign</text>
  <text x="1074" y="228" class="s">upload links in the browser; nothing</text>
  <text x="1074" y="249" class="xs">stored yet</text>
  <text x="362" y="335" class="t">1</text>
  <text x="396" y="333" class="t">upload the original</text>
  <text x="396" y="357" class="s">straight from the browser to S3, not through the server</text>
  <text x="1002" y="333" class="a" text-anchor="end">browser</text>
  <text x="1074" y="333" class="s">the original in S3</text>
  <text x="362" y="440" class="t">2</text>
  <text x="396" y="438" class="t">make smaller versions</text>
  <text x="396" y="462" class="s">display, thumbnail and placeholder, made in the browser at the same time</text>
  <text x="396" y="483" class="s">as step 1</text>
  <text x="1002" y="438" class="a" text-anchor="end">browser</text>
  <text x="1074" y="438" class="s">display and thumbnail in S3</text>
  <text x="362" y="545" class="t">3</text>
  <text x="396" y="543" class="t">finish</text>
  <text x="396" y="567" class="s">the web app records the memory once the original is up, and the smaller</text>
  <text x="396" y="588" class="s">versions when they are up</text>
  <text x="1002" y="543" class="a" text-anchor="end">/api/upload/complete</text>
  <text x="1074" y="543" class="s">a memory row, its file rows and its</text>
  <text x="1074" y="564" class="xs">storage edges in Postgres</text>
  <text x="362" y="650" class="t">4</text>
  <text x="396" y="648" class="t">show it</text>
  <text x="396" y="672" class="s">the dashboard lists the memory; images load from S3</text>
  <text x="1002" y="648" class="a" text-anchor="end">you</text>
  <text x="1074" y="648" class="s">the memory in your dashboard</text>
  <text x="60" y="898" class="s">The server never handles the file bytes: it signs the links and writes the records. Vercel Blob works the same way with its own routes.</text>
  <text x="60" y="926" class="s">Many files at once: the same steps, with batches of links. A folder becomes a folder in Futura.</text>
  <text x="60" y="954" class="a">Not tested in November 2026: uploads need real S3 or Blob credentials, which the local setup does not have.</text>
  <text x="1480" y="954" class="s" text-anchor="end">As of: 24 November 2026</text>
  <text x="62" y="47" class="s">who starts the step</text>
</svg>
</body>
</html>
