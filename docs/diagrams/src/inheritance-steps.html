<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<title>Inheritance, step by step</title>
<style>
  :root { --paper:#fbfaf6; --ink:#1d1d1b; --soft:#6b6a66; --accent:#b4531a; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { padding:16px; font-family:"Patrick Hand","Bradley Hand","Segoe Print","Comic Sans MS","Chalkboard SE",cursive; }
  svg { display:block; width:100%; height:auto; max-width:1500px; margin:0 auto; }
  .line  { fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .thin  { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .plan  { stroke-dasharray:9 7; }
  .svc   { stroke:var(--accent); stroke-width:2.2; }
  .acc   { stroke:var(--accent); }
  .fill  { fill:var(--paper); }
  .dot   { fill:var(--accent); stroke:none; }
  .door  { fill:var(--accent); stroke:var(--ink); stroke-width:1.6; }
  .ca { fill:var(--accent); stroke:var(--ink); stroke-width:1; }
  .cb { fill:var(--ink); stroke:var(--ink); stroke-width:1; }
  .cc { fill:#c9c6bd; stroke:var(--ink); stroke-width:1; }
  .cs { fill:url(#hatch); stroke:var(--ink); stroke-width:1; }
  .ce { fill:none; stroke:#cfcdc6; stroke-width:1; }
  .pw { fill:#f3d9c6; stroke:var(--accent); stroke-width:2; }
  .pa { fill:#ffffff; stroke:var(--ink); stroke-width:2.2; }
  .pk { fill:#dedbd2; stroke:var(--ink); stroke-width:1.4; }
  .ps { fill:url(#hatch); stroke:var(--ink); stroke-width:1.4; }
  .cn { fill:#fbfaf6; stroke:var(--ink); stroke-width:1.3; }
  .cz { fill:none; stroke:var(--accent); stroke-width:3; }
  .t     { font-size:22px; fill:var(--ink); }
  .h     { font-size:30px; fill:var(--ink); }
  .col   { font-size:24px; fill:var(--soft); letter-spacing:1px; }
  .s     { font-size:18px; fill:var(--soft); }
  .xs    { font-size:16px; fill:var(--soft); }
  .a     { font-size:18px; fill:var(--accent); }
  .mono  { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:17px; fill:var(--ink); }
  .monoa { font-family:ui-monospace,"SF Mono",Menlo,"DejaVu Sans Mono",monospace; font-size:16px; fill:var(--accent); }
</style>
</head>
<body>
<svg viewBox="0 0 1500 960" role="img" aria-label="Inheritance: the owner shares a memory with an heir on the condition after death and names trustees; trustees confirm the death; when enough have confirmed, a waiting period runs; then the heir can read what was shared; the owner can cancel at any time">
  <defs>
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1d1d1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
  </defs>
  <g filter="url(#hand)">
    <rect x="20" y="70" width="1460" height="790" rx="10" class="line fill"/>
    <rect x="30" y="200" width="240" height="168" rx="6" class="line fill"/>
    <rect x="330" y="190" width="700" height="650" rx="6" class="line fill"/>
    <rect x="346" y="200" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="200" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,238 L1056,238" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="290" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="290" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,328 L1056,328" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="380" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="380" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,418 L1056,418" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="470" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="470" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,508 L1056,508" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="560" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="560" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,598 L1056,598" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="650" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="650" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,688 L1056,688" class="line" marker-end="url(#arrow)"/>
    <rect x="346" y="740" width="668" height="76" rx="6" class="thin fill"/>
    <rect x="1060" y="740" width="400" height="76" rx="6" class="thin fill"/>
    <path d="M1016,778 L1056,778" class="line" marker-end="url(#arrow)"/>
    <path d="M274,230 L328,230" class="line" marker-end="url(#arrow)"/>
  </g>
  <circle cx="280" cy="230" r="6" class="dot"/>
  <circle cx="46" cy="40" r="6" class="dot"/>
  <text x="750" y="46" class="h" text-anchor="middle">Inheritance, step by step</text>
  <text x="150" y="122" class="col" text-anchor="middle">THE OWNER</text>
  <text x="150" y="150" class="s" text-anchor="middle">while alive</text>
  <text x="680" y="122" class="col" text-anchor="middle">THE STEPS</text>
  <text x="680" y="150" class="s" text-anchor="middle">what happens, in order</text>
  <text x="1260" y="122" class="col" text-anchor="middle">WHAT EXISTS NOW</text>
  <text x="1260" y="150" class="s" text-anchor="middle">after each step</text>
  <text x="46" y="232" class="t">Your capsule</text>
  <text x="46" y="262" class="s">on ICP, written</text>
  <text x="46" y="286" class="s">with your own key</text>
  <text x="46" y="320" class="xs">you:</text>
  <text x="46" y="342" class="a">decide who inherits what</text>
  <text x="362" y="230" class="t">0</text>
  <text x="396" y="228" class="t">share a memory, after death</text>
  <text x="396" y="248" class="s">an access entry for the heir with the condition: after death. It gives</text>
  <text x="396" y="267" class="s">nothing yet</text>
  <text x="1002" y="228" class="a" text-anchor="end">owner</text>
  <text x="1074" y="228" class="s">the heir is on the memory&#x27;s list, and</text>
  <text x="1074" y="249" class="xs">reads nothing</text>
  <text x="362" y="320" class="t">1</text>
  <text x="396" y="318" class="t">name trustees</text>
  <text x="396" y="338" class="s">up to 10 trustees, how many of them must confirm, and how long to wait</text>
  <text x="396" y="357" class="s">after that</text>
  <text x="1002" y="318" class="a" text-anchor="end">owner</text>
  <text x="1074" y="318" class="s">the rules on the capsule; the owner</text>
  <text x="1074" y="339" class="xs">cannot be a trustee</text>
  <text x="362" y="410" class="t">2</text>
  <text x="396" y="408" class="t">trustees confirm the death</text>
  <text x="396" y="432" class="s">each with their own key. A trustee can take it back during the wait</text>
  <text x="1002" y="408" class="a" text-anchor="end">trustees</text>
  <text x="1074" y="408" class="s">confirmations, each with its date</text>
  <text x="362" y="500" class="t">3</text>
  <text x="396" y="498" class="t">the waiting period runs</text>
  <text x="396" y="518" class="s">it starts when enough trustees have confirmed. No timer: the dates are</text>
  <text x="396" y="537" class="s">compared on every read</text>
  <text x="1002" y="498" class="a" text-anchor="end">nobody</text>
  <text x="1074" y="498" class="s">the date when the death takes effect</text>
  <text x="362" y="590" class="t">4</text>
  <text x="396" y="588" class="t">the owner can cancel</text>
  <text x="396" y="612" class="s">legacy_cancel_death with the owner&#x27;s key, during the wait or later</text>
  <text x="1002" y="588" class="a" text-anchor="end">owner</text>
  <text x="1074" y="588" class="s">all confirmations gone; heirs locked out</text>
  <text x="1074" y="609" class="xs">again</text>
  <text x="362" y="680" class="t">5</text>
  <text x="396" y="678" class="t">access opens</text>
  <text x="396" y="702" class="s">once the waiting period is over, the after-death entries count</text>
  <text x="1002" y="678" class="a" text-anchor="end">nobody</text>
  <text x="1074" y="678" class="s">the heir may view what was shared with</text>
  <text x="1074" y="699" class="xs">them, nothing else</text>
  <text x="362" y="770" class="t">6</text>
  <text x="396" y="768" class="t">the heir reads</text>
  <text x="396" y="792" class="s">memories_list_shared and memories_read_shared, with the heir&#x27;s own key</text>
  <text x="1002" y="768" class="a" text-anchor="end">heir</text>
  <text x="1074" y="768" class="s">the memory, and of its access list only</text>
  <text x="1074" y="789" class="xs">the heir&#x27;s own entry</text>
  <text x="60" y="898" class="s">A trustee only confirms and gets no access. Strangers get &quot;not found&quot;, so they do not even learn that a capsule exists.</text>
  <text x="60" y="926" class="s">Other events (a wedding, a graduation, your own) the owner records and revokes alone. A death can never be recorded that way.</text>
  <text x="60" y="954" class="a">Status: tested on a local ICP network, 25 November 2026, on the shared canister. Not built: a web page for it; file links over HTTP for heirs.</text>
  <text x="1480" y="954" class="s" text-anchor="end">As of: 25 November 2026</text>
  <text x="62" y="47" class="s">who starts the step</text>
</svg>
</body>
</html>
